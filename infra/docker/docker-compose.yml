services:
    kafka:
      image: bitnami/kafka:3.7
      container_name: tickerflow-kafka
      ports:
        - "9092:9092"
      environment:
        - KAFKA_CFG_NODE_ID=1
        - KAFKA_CFG_PROCESS_ROLES=broker,controller
        - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
        - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
        - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
        - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
        - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
        - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      volumes:
        - kafka-data:/bitnami/kafka

    kafka-init:
      image: bitnami/kafka:3.7
      container_name: tickerflow-kafka-init
      depends_on:
        - kafka
      entrypoint: ["/bin/bash", "-c"]
      command: |
        "
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-ticks --partitions 3 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic candles --partitions 3 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic signals --partitions 1 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trade-events --partitions 1 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-ticks.DLT --partitions 1 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic candles.DLT --partitions 1 --replication-factor 1
        echo 'Topics created.'
        "

    postgres:
      image: postgres:16
      container_name: tickerflow-postgres
      ports:
        - "5432:5432"
      environment:
        - POSTGRES_USER=tickerflow
        - POSTGRES_PASSWORD=tickerflow
        - POSTGRES_DB=tickerflow
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    kafka-ui:
      image: provectus/kafka-ui:latest
      container_name: tickerflow-kafka-ui
      ports:
        - "8080:8080"
      environment:
        - KAFKA_CLUSTERS_0_NAME=local
        - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      depends_on:
        - kafka

volumes:
  kafka-data:
  postgres-data: