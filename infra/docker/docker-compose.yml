services:
    kafka:
      image: apache/kafka:latest
      container_name: tickerflow-kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        CLUSTER_ID: ZuzrZfYaQaiKS0jTneJd7Q
      volumes:
        - kafka-data:/var/lib/kafka/data

    kafka-init:
      image: apache/kafka:latest
      container_name: tickerflow-kafka-init
      depends_on:
        - kafka
      entrypoint: [ "/bin/bash", "-c" ]
      command: |
        "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-ticks --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic candles --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic signals --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trade-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-ticks.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic candles.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        echo 'Topics created.'
        "

    postgres:
      image: postgres:16
      container_name: tickerflow-postgres
      ports:
        - "5433:5432"
      environment:
        - POSTGRES_USER=tickerflow
        - POSTGRES_PASSWORD=tickerflow
        - POSTGRES_DB=tickerflow
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: tickerflow-kafka-ui
      ports:
        - "8081:8080"
      environment:
        - KAFKA_CLUSTERS_0_NAME=local
        - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
        - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
      depends_on:
        - kafka

    schema-registry:
      image: confluentinc/cp-schema-registry:7.6.0
      container_name: tickerflow-schema-registry
      ports:
        - "8082:8081"
      environment:
        SCHEMA_REGISTRY_HOST_NAME: schema-registry
        SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
        SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      depends_on:
        - kafka

volumes:
  kafka-data:
  postgres-data: